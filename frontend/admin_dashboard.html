<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Autoservicio 20 de Junio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="app-container" style="display: flex; width: 100%; height: 100%;">
        <div id="layout-sidebar-placeholder"></div>
        <div class="main-wrapper">
            <div id="layout-navbar-placeholder"></div>

            <div class="content-area p-4">
                <h3 class="fw-bold mb-4" style="color: #1a365d;"><i class="bi bi-speedometer2"></i> Panel de Control
                </h3>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 bg-primary text-white h-100">
                            <div class="card-body">
                                <h6 class="text-uppercase mb-2 text-white-50">Ingresos Hoy</h6>
                                <h2 class="fw-bold mb-0" id="dash-ingresos">$0.00</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 text-white h-100" style="background-color: #1a365d;">
                            <div class="card-body">
                                <h6 class="text-uppercase mb-2 text-white-50">Tickets Emitidos</h6>
                                <h2 class="fw-bold mb-0" id="dash-tickets">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white fw-bold"><i class="bi bi-bar-chart-fill text-primary"></i>
                                Ventas por Hora</div>
                            <div class="card-body">
                                <canvas id="graficoHorarios" height="100"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm border-danger h-100">
                            <div class="card-header bg-danger text-white fw-bold"><i
                                    class="bi bi-exclamation-triangle"></i> Stock Crítico</div>
                            <ul class="list-group list-group-flush" id="lista-stock">
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/layout.js"></script>
    <script src="js/app_dashboard.js"></script>
</body>

</html>
