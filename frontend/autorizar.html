<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorizar caja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0B1320; color: #E2E8F0; }
        .caja { max-width: 420px; margin: 2rem auto; background: #142032; border: 1px solid #1F304A; border-radius: 12px; padding: 1.25rem; }
        .motivo { background: #070B14; border-radius: 8px; padding: .75rem; }
    </style>
</head>
<body>
    <div class="caja">
        <h1 class="h5 fw-bold mb-3">Autorización de caja</h1>
        <p id="estado" class="small text-secondary">Cargando…</p>
        <p id="motivo" class="motivo"></p>
        <form id="form" class="mt-3" hidden>
            <label class="form-label small" for="pin">PIN de Admin o Encargado</label>
            <input id="pin" type="password" class="form-control mb-3" autocomplete="off" inputmode="numeric">
            <div class="d-grid gap-2">
                <button class="btn btn-success fw-bold" type="submit" data-decision="APROBADA">Aprobar</button>
                <button class="btn btn-outline-danger fw-bold" type="submit" data-decision="RECHAZADA">Rechazar</button>
            </div>
        </form>
    </div>
    <script>
        function baseUrl() {
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8000';
            if (location.protocol === 'file:' || !location.hostname) return 'http://185.249.225.63:8000';
            return location.origin;
        }
        const token = new URLSearchParams(location.search).get('t') || '';
        const estado = document.getElementById('estado');
        const motivo = document.getElementById('motivo');
        const form = document.getElementById('form');

        function mostrar(texto, esError) {
            estado.textContent = texto;
            estado.className = esError ? 'small text-danger' : 'small text-secondary';
        }

        async function cargar() {
            if (!token) return mostrar('Solicitud inexistente.', true);
            const res = await fetch(`${baseUrl()}/usuarios/autorizacion-remota/${encodeURIComponent(token)}`);
            const data = await res.json();
            if (data.error) return mostrar(data.error, true);
            motivo.textContent = data.motivo || '';
            if (data.estado === 'PENDIENTE') {
                mostrar('Ingresá el PIN para confirmar.');
                form.hidden = false;
                return;
            }
            if (data.estado === 'APROBADA') return mostrar('Autorización aprobada' + (data.usuario ? ` por ${data.usuario}` : '') + '.');
            if (data.estado === 'RECHAZADA') return mostrar('Autorización rechazada.');
            mostrar('Solicitud vencida.');
        }

        form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const decision = ev.submitter && ev.submitter.dataset.decision;
            const pin = document.getElementById('pin').value.trim();
            if (!pin) return mostrar('Ingresá el PIN.', true);
            const res = await fetch(`${baseUrl()}/usuarios/autorizacion-remota/${encodeURIComponent(token)}/resolver`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin_secreto: pin, decision })
            });
            const data = await res.json();
            if (data.error) return mostrar(data.error, true);
            form.hidden = true;
            mostrar(data.estado === 'APROBADA' ? `Aprobada por ${data.usuario}.` : 'Rechazada.');
        });

        cargar().catch(() => mostrar('No se pudo cargar el pedido.', true));
    </script>
</body>
</html>
