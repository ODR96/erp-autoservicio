# ERPetto — Nginx 80 → uvicorn 127.0.0.1:8000
# En el VPS (después de git pull):
#   sudo apt-get install -y nginx
#   sudo cp deploy/nginx-erpetto.conf /etc/nginx/sites-available/erpetto
#   sudo ln -sf /etc/nginx/sites-available/erpetto /etc/nginx/sites-enabled/erpetto
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Probar http://IP/  (sin :8000). El JS ya usa mismo origen en 80/443.
# uvicorn: --host 127.0.0.1 --port 8000
# UFW: dejar 8000 abierto hasta actualizar Electron (file:// sigue pegando a :8000).
# HTTPS/cámara: certbot --nginx  (después).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
